name: hotwheels_app
description: "Hot Wheels die-cast car collection manager with camera-based recognition."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0-196.1.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  cloud_functions: ^5.3.4

  # Auth
  google_sign_in: ^6.2.2

  # State & Navigation
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

  # Camera & Images
  camera: ^0.11.1
  image_picker: ^1.1.2
  image_cropper: ^9.0.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # ML Kit
  google_mlkit_object_detection: ^0.15.1
  google_mlkit_image_labeling: ^0.14.0

  # Freezed annotations
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generation
  freezed: ^3.0.6
  json_serializable: ^6.9.4
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.5

flutter:
  uses-material-design: true
